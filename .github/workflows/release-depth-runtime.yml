name: Release Windows depth runtime

on:
  workflow_dispatch:

concurrency:
  group: depth-runtime-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/depth-runtime-windows-check.yml
    with:
      store_packages: true
      variants: '["cpu"]'
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BEEFTV_UPDATER_PRIVATE_KEY: ${{ secrets.BEEFTV_UPDATER_PRIVATE_KEY }}
      BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require fork main and unused runtime tag
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = canbaobaox/mindversetv
          test "$GITHUB_REF" = refs/heads/main
          if gh release view depth-runtime-v2 >/dev/null 2>&1 || git ls-remote --exit-code origin refs/tags/depth-runtime-v2 >/dev/null 2>&1; then
            echo 'Runtime release already exists; immutable assets cannot be overwritten.'
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: depth-runtime-*
          merge-multiple: true
          path: dist/depth
      - name: Fetch model weights for release
        run: |
          set -euo pipefail
          curl -L --fail -o dist/depth/video_depth_anything_vits.pth https://huggingface.co/depth-anything/Video-Depth-Anything-Small/resolve/main/video_depth_anything_vits.pth
      - name: Verify all packages and sign installer manifest
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_prepare_depth_manifest.py'
          python3 scripts/prepare-depth-manifest.py dist/depth dist/depth-payload.json --cpu-only
          cd backend
          go test ./cmd/update-release ./internal/depthruntime
          go run ./cmd/update-release sign-depth --cpu-only --input ../dist/depth-payload.json --output ../dist/depth/depth-runtime-manifest.v2.json
          go run ./cmd/update-release verify-depth --cpu-only --input ../dist/depth/depth-runtime-manifest.v2.json
      - name: Publish immutable optional runtime
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Windows x64 optional depth-video runtime for MindVerseTV (CPU only).

          CPU inference runs on any Windows x64 machine; processing can be slow and memory intensive. The Small model is downloaded on first use. The signed manifest verifies the archive. This is an optional component, not a desktop installer.
          EOF
          gh release create depth-runtime-v2 --draft --target "$GITHUB_SHA" --title 'Windows depth runtime v2 — CPU only (MindVerseTV)' --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload depth-runtime-v2 dist/depth/*
          gh release edit depth-runtime-v2 --draft=false --prerelease --latest=false
